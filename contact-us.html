<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact us — Bonafide International School</title>
  <meta name="description" content="Contact Bonafide International School in Hawassa, Ethiopia: address, phone, email, map location and our social media channels." />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="pill"><h1>Contact us</h1></div>

    <section class="contact-section">
      <div class="map-wrapper">
        <img id="mapImage" class="map-static" src="map.png" alt="Map showing the location of Bonafide International School in Hawassa" />
        <div class="map-caption">
          <span id="mapAddress">Hawassa, Ethiopia</span>
          <a id="mapLink" class="btn btn-sm" target="_blank" rel="noopener noreferrer"
             href="https://www.google.com/maps/search/?api=1&amp;query=Bonafide%20School%2C%20Hawassa%2C%20Ethiopia">Open live map</a>
        </div>
      </div>

      <div class="card card-accent contact-info">
        <h2>Get in touch</h2>
        <div class="contact-line">
          <div class="ico">📍</div>
          <div><b>Address</b><span id="infoAddress">Hawassa, Sidama Region, Ethiopia</span></div>
        </div>
        <div class="contact-line">
          <div class="ico">📞</div>
          <div><b>Phone</b><a id="infoPhone" href="tel:+251462125487">+251 46 212 5487</a></div>
        </div>
        <div class="contact-line">
          <div class="ico">✉️</div>
          <div><b>Email</b><a id="infoEmail" href="mailto:bonafideschool@gmail.com">bonafideschool@gmail.com</a></div>
        </div>
        <div class="contact-line hours">
          <div class="ico">🕒</div>
          <div><b>Office hours</b><span>Monday – Friday, 08:00 – 17:00</span></div>
        </div>
        <p class="small muted" style="margin-top:14px">
          Follow our school channels using the icons in the footer below.
        </p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/bis_store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
