<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timetables — Bonafide International School</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="pill"><h1>Weekly timetables</h1></div>

    <div class="row" style="margin-bottom:16px">
      <label for="gradeSelect" style="margin:0">Grade</label>
      <input id="gradeSelect" type="text" maxlength="20" placeholder="e.g. 10A" style="max-width:140px" />
      <label for="teacherSelect" style="margin:0">Teacher</label>
      <select id="teacherSelect" style="max-width:240px"></select>
      <button class="btn btn-ghost" id="addPeriod">+ Add period</button>
      <button class="btn btn-green right" id="saveAll">Save timetable</button>
    </div>
    <p class="hint" id="status">Editing grade <strong>10A</strong>. Teachers and students see the timetable for their own grade.</p>

    <div class="timetable-grid" id="grid" style="margin-top:16px"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/bis_store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/timetable_admin.js"></script>
</body>
</html>
