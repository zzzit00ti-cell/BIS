<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Announcements — Bonafide International School</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="pill"><h1>Announcements</h1></div>

    <div class="row" style="margin-bottom:14px">
      <label for="searchInput" style="margin:0">Search</label>
      <input id="searchInput" type="search" placeholder="Search titles and text" style="max-width:280px" />
      <label class="check" style="margin:0"><input type="checkbox" id="pinnedOnly" /> Pinned only</label>
      <span class="hint right" id="count"></span>
    </div>

    <div class="split-panels">
      <div class="card">
        <ul class="list-plain" id="list"></ul>
      </div>
      <div class="card" id="detail"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/bis_store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/announcements_reader.js"></script>
</body>
</html>
