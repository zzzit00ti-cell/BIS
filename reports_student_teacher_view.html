<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gradebook — Bonafide International School</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="pill"><h1>Gradebook</h1></div>

    <div class="row" style="margin-bottom:14px">
      <label for="gradeSelect" style="margin:0">Grade</label>
      <select id="gradeSelect" style="max-width:180px"></select>
      <div class="subject-bar" id="subjects"></div>
      <button class="btn btn-ghost" id="addSubject">+ Subject</button>
      <button class="btn btn-green right" id="saveBtn">Save grades</button>
    </div>

    <div class="stat-grid" id="summary" style="margin-bottom:16px"></div>

    <div class="card gradebook">
      <h2 id="rosterTitle">Students</h2>
      <div class="table-wrap">
        <table class="data">
          <thead id="head"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/bis_store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gradebook_teacher.js"></script>
</body>
</html>
