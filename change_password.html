<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change password — Bonafide International School</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Change your password</h1>
        <p class="muted" data-role-tagline></p>
        <div id="requiredNotice" class="alert alert-warn hidden">
          Your password was set by an administrator. Choose your own password to continue.
        </div>
        <div id="formError" class="alert alert-err hidden" role="alert"></div>
        <div id="formOk" class="alert alert-ok hidden" role="status"></div>

        <form id="pwForm" autocomplete="on" novalidate>
          <div class="field">
            <label for="current">Current password</label>
            <input id="current" type="password" autocomplete="current-password" required maxlength="128" />
          </div>
          <div class="field">
            <label for="next">New password</label>
            <div class="pw-row">
              <input id="next" type="password" autocomplete="new-password" required maxlength="128" />
              <button type="button" class="btn btn-ghost" data-generate="next">Generate</button>
            </div>
            <div id="pwFeedback"></div>
          </div>
          <div class="field">
            <label for="confirm">Confirm new password</label>
            <input id="confirm" type="password" autocomplete="new-password" required maxlength="128" />
            <div class="hint" id="matchHint"></div>
          </div>
          <button type="submit" class="btn" id="submitBtn" style="width:100%">Update password</button>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/bis_store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/change_password.js"></script>
</body>
</html>
