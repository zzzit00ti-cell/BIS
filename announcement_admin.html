<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Announcements — Bonafide International School</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="pill"><h1>Announcements</h1></div>

    <div class="split-panels">
      <div class="card card-green">
        <h2 id="formTitle">Publish an announcement</h2>
        <form id="form" autocomplete="off">
          <div class="field">
            <label for="titleInput">Title</label>
            <input id="titleInput" maxlength="140" required />
          </div>
          <div class="field">
            <label for="bodyInput">Content</label>
            <textarea id="bodyInput" rows="6" maxlength="4000" required></textarea>
          </div>
          <div class="row">
            <div class="field" style="flex:1;min-width:160px;margin:0">
              <label for="audienceSelect">Audience</label>
              <select id="audienceSelect">
                <option value="all">Everyone</option>
                <option value="student">Students</option>
                <option value="teacher">Teachers</option>
                <option value="admin">Administrators</option>
              </select>
            </div>
            <label class="check" style="margin-top:26px"><input type="checkbox" id="pinnedInput" /> Pin to top</label>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="btn btn-green" id="submitBtn" type="submit">Publish</button>
            <button class="btn btn-ghost" id="resetBtn" type="button">Clear</button>
            <span class="hint" id="formHint"></span>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <h2 style="margin:0">Published</h2>
          <select id="filterSelect" class="right" style="max-width:150px">
            <option value="all">All audiences</option>
            <option value="student">Students</option>
            <option value="teacher">Teachers</option>
            <option value="admin">Admins</option>
          </select>
        </div>
        <ul class="list-plain" id="list"></ul>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/bis_store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/announcement_admin.js"></script>
</body>
</html>
